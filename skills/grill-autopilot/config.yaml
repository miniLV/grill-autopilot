# grill-autopilot: role -> model.
# Override per repo with .grill-autopilot.yaml at the repo root; keys set there win.
# Claude values are aliases (opus / sonnet / haiku) that follow new releases.
# Codex values are model slugs; change one line when a new slug ships.
# gpt-6-astra is the expensive Codex tier: name it here only when you want it.

runtime: auto          # auto | claude | codex
concurrency: 3         # worker ceiling; ALL child roles also consume host slots (runtimes.md)
timeouts:
  attempt_seconds: 1800 # bounded wait deadline includes preparation and role execution
retry:
  worker: 1            # extra business retries after initial worker: 2 total by default
  escalate: 1          # escalate attempts after worker exhaustion; an Implementer: escalate ticket gets 1 + this
  infrastructure: 1    # extra retry of SAME logical attempt; deadline/counters do not reset
  final_review: 2      # TOTAL final correction rounds beyond initial review; final-review.md

# reviewer gates the output of worker and escalate: keep it at least as capable as both.
roles:
  planner:  { claude: opus,   codex: gpt-6.1-sol, effort: high }    # grill, spec, tickets, scheduling
  reviewer: { claude: opus,   codex: gpt-6.1-sol, effort: high }    # per-ticket gate, final code-review
  worker:   { claude: haiku,  codex: gpt-6-luna,  effort: medium }  # implements Implementer: worker tickets
  escalate: { claude: sonnet, codex: gpt-6.1-sol, effort: high }    # implements Implementer: escalate tickets, retries failed worker tickets, applies final fixes
